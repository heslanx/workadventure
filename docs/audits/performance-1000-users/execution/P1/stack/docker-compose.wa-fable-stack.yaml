# Task-owned WorkAdventure server stack for the P1 protocol load generator.
# Host: sbh. Path on host: ~/wa-jobs/wa-fable-20261111/stack/docker-compose.yaml
# Source tree: ~/wa-jobs/wa-fable-20261111/src-wa-fable-stack (baseline ddbe245a8, npm ci'd, mounted read-only).
#
# No published ports, no reverse proxy. Everything is reachable only from containers attached to wa-fable-net.
# Caps: cpus 0.65 + 0.65 + 0.10 + 0.10 = 1.50 cores; memory 1536m + 1536m + 128m + 256m = 3456m.
# All keys below are synthetic values, not secrets.
name: wa-fable-stack

x-common: &common
  labels:
    owner: wa-fable-20261111
  cpu_shares: 512
  restart: "no"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  redis:
    <<: *common
    image: redis:6
    container_name: wa-fable-stack-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    cpus: 0.10
    mem_limit: 256m

  maps:
    <<: *common
    image: nginx:1.27-alpine
    container_name: wa-fable-stack-maps
    cpus: 0.10
    mem_limit: 128m
    volumes:
      - /root/wa-jobs/wa-fable-20261111/src-wa-fable-stack/maps:/usr/share/nginx/html:ro

  back:
    <<: *common
    image: node:24-trixie
    container_name: wa-fable-stack-back
    # Same script the dev compose runs for the back: tsx watch --inspect=0.0.0.0:9229 src/server.ts
    command: npm run dev
    working_dir: /usr/src/app/back
    cpus: 0.65
    mem_limit: 1536m
    tmpfs: /tmp
    volumes:
      - /root/wa-jobs/wa-fable-20261111/src-wa-fable-stack:/usr/src/app:ro
    environment:
      # "localhost" in PLAY_URL keeps the back's install telemetry disabled (TelemetryService).
      PLAY_URL: http://play.workadventure.localhost
      MINIMUM_DISTANCE: "64"
      GROUP_RADIUS: "48"
      MAX_PER_GROUP: "100"
      SECRET_KEY: wa-fable-synthetic-secret-key
      SECRET_JITSI_KEY: ""
      ENABLE_MAP_EDITOR: "false"
      ALLOW_ARTILLERY: "true"
      ADMIN_API_URL: ""
      REDIS_HOST: wa-fable-stack-redis
      NODE_ENV: development
      # Lets the back load a map served from a private address (the maps container).
      STORE_VARIABLES_FOR_LOCAL_MAPS: "true"
      PLAYER_VARIABLES_MAX_TTL: "-1"
      ENABLE_CHAT: "true"
      ENABLE_CHAT_UPLOAD: "true"
      # Metrics on a dedicated in-network port (no token needed on a dedicated port).
      PROMETHEUS_PORT: "9100"
    depends_on:
      - redis
      - maps

  play:
    <<: *common
    image: node:24-trixie
    container_name: wa-fable-stack-play
    # The pusher half of the dev compose's "npm run dev" (no vite, no svelte-check, no i18n watch):
    # TSX_TSCONFIG_PATH=tsconfig-pusher.json tsx watch --clear-screen=false --inspect=0.0.0.0:9229 ./src/server.ts
    command: npm run dev-pusher
    working_dir: /usr/src/app/play
    cpus: 0.65
    mem_limit: 1536m
    tmpfs: /tmp
    volumes:
      - /root/wa-jobs/wa-fable-20261111/src-wa-fable-stack:/usr/src/app:ro
    environment:
      HOST: "0.0.0.0"
      NODE_ENV: development
      # Same as the dev compose: the auth token sent in Sec-WebSocket-Protocol can exceed uWebSockets' 4 KB default
      UWS_HTTP_MAX_HEADERS_SIZE: "16384"
      ALLOWED_CORS_ORIGIN: "*"
      PUSHER_URL: http://wa-fable-stack-play:3000
      FRONT_URL: http://wa-fable-stack-play:3000
      # Required by the pusher's env validation; dev compose value. No icon server runs here (only browsers use it).
      ICON_URL: http://icon.workadventure.localhost
      # ASSETS_URL left unset on purpose: the pusher then uses play/index.html and never waits for a front container.
      SECRET_KEY: wa-fable-synthetic-secret-key
      ADMIN_API_URL: ""
      MAP_STORAGE_API_TOKEN: wa-fable-synthetic-map-storage-token
      API_URL: wa-fable-stack-back:50051
      DISABLE_ANONYMOUS: ""
      ENABLE_MAP_EDITOR: "false"
      REDIS_HOST: wa-fable-stack-redis
      START_ROOM_URL: /_/global/wa-fable-stack-maps/starter/map.json
      MAX_PER_GROUP: "100"
      MAX_USERNAME_LENGTH: "10"
      ENABLE_CHAT: "true"
      ENABLE_CHAT_UPLOAD: "true"
      ENABLE_CHAT_ONLINE_LIST: "true"
      ENABLE_CHAT_DISCONNECTED_LIST: "true"
      CLIENT_DISCONNECTION_RETENTION_MS: "30000"
      PUSHER_ADMIN_WS_MAX_BACKPRESSURE_BYTES: "1048576"
      ENABLE_TUTORIAL: "false"
      DEBUG_MODE: "false"
      PROMETHEUS_PORT: "9100"
    depends_on:
      - back
      - redis

networks:
  default:
    name: wa-fable-net
    labels:
      owner: wa-fable-20261111

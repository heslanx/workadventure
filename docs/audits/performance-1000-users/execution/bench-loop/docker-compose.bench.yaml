# Task-owned WorkAdventure server stack for the bench loop (knc, owner wa-fable-20261112).
# One stack at a time; the source tree under test is ${SRC} (mounted read-only).
# No published ports. Caps: 0.65 + 0.65 + 0.10 + 0.10 = 1.50 cores; 1536m + 1536m + 128m + 256m memory.
# BACK_CPUS overrides the back cap (V2 keeps it at 0.65; the quota-aware tracker reads it from the cgroup).
# All keys below are synthetic values, not secrets.
name: wa-fable-bench

x-common: &common
  labels:
    owner: wa-fable-20261112
  cpu_shares: 512
  restart: "no"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  redis:
    <<: *common
    image: redis:6
    container_name: wa-fable-bench-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    cpus: 0.10
    mem_limit: 256m

  maps:
    <<: *common
    image: nginx:1.27-alpine
    container_name: wa-fable-bench-maps
    cpus: 0.10
    mem_limit: 128m
    volumes:
      - ${SRC:?}/maps:/usr/share/nginx/html:ro

  back:
    <<: *common
    image: node:24-trixie
    container_name: wa-fable-bench-back
    command: npm run dev
    working_dir: /usr/src/app/back
    cpus: ${BACK_CPUS:-0.65}
    mem_limit: 1536m
    tmpfs: /tmp
    volumes:
      - ${SRC:?}:/usr/src/app:ro
    environment:
      PLAY_URL: http://play.workadventure.localhost
      MINIMUM_DISTANCE: "64"
      GROUP_RADIUS: "48"
      MAX_PER_GROUP: "100"
      SECRET_KEY: wa-fable-synthetic-secret-key
      SECRET_JITSI_KEY: ""
      ENABLE_MAP_EDITOR: "false"
      ALLOW_ARTILLERY: "true"
      ADMIN_API_URL: ""
      REDIS_HOST: wa-fable-bench-redis
      NODE_ENV: development
      STORE_VARIABLES_FOR_LOCAL_MAPS: "true"
      PLAYER_VARIABLES_MAX_TTL: "-1"
      ENABLE_CHAT: "true"
      ENABLE_CHAT_UPLOAD: "true"
      PROMETHEUS_PORT: "9100"
    depends_on:
      - redis
      - maps

  play:
    <<: *common
    image: node:24-trixie
    container_name: wa-fable-bench-play
    command: npm run dev-pusher
    working_dir: /usr/src/app/play
    cpus: 0.65
    mem_limit: 1536m
    tmpfs: /tmp
    volumes:
      - ${SRC:?}:/usr/src/app:ro
    environment:
      HOST: "0.0.0.0"
      NODE_ENV: development
      UWS_HTTP_MAX_HEADERS_SIZE: "16384"
      ALLOWED_CORS_ORIGIN: "*"
      PUSHER_URL: http://wa-fable-bench-play:3000
      FRONT_URL: http://wa-fable-bench-play:3000
      ICON_URL: http://icon.workadventure.localhost
      SECRET_KEY: wa-fable-synthetic-secret-key
      ADMIN_API_URL: ""
      MAP_STORAGE_API_TOKEN: wa-fable-synthetic-map-storage-token
      API_URL: wa-fable-bench-back:50051
      DISABLE_ANONYMOUS: ""
      ENABLE_MAP_EDITOR: "false"
      REDIS_HOST: wa-fable-bench-redis
      START_ROOM_URL: /_/global/wa-fable-bench-maps/starter/map.json
      MAX_PER_GROUP: "100"
      MAX_USERNAME_LENGTH: "10"
      ENABLE_CHAT: "true"
      ENABLE_CHAT_UPLOAD: "true"
      ENABLE_CHAT_ONLINE_LIST: "true"
      ENABLE_CHAT_DISCONNECTED_LIST: "true"
      CLIENT_DISCONNECTION_RETENTION_MS: "30000"
      PUSHER_ADMIN_WS_MAX_BACKPRESSURE_BYTES: "1048576"
      ENABLE_TUTORIAL: "false"
      DEBUG_MODE: "false"
      PROMETHEUS_PORT: "9100"
    depends_on:
      - back
      - redis

networks:
  default:
    name: wa-fable-bench-net
    labels:
      owner: wa-fable-20261112

services:
  reverse-proxy:
    ports: !override
      - "127.0.0.1:80:80"
    command:
      - --providers.docker
      - --entryPoints.web.address=:80
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`workadventure-sprite-check`)
  play:
    command: npm exec concurrently --kill-others-on-fail npm:dev-front npm:dev-pusher
    environment:
      STARTUP_COMMAND_2: "true"
      OPENID_CLIENT_ID: ""
      OPENID_CLIENT_SECRET: ""
      OPENID_CLIENT_ISSUER: ""
      OPENID_SCOPE: ""
      DISABLE_ANONYMOUS: "false"
      ENABLE_CHAT: "false"
      ENABLE_TUTORIAL: "false"
      SKIP_CAMERA_PAGE: "true"
      DEFAULT_CAMERA_PRIVACY_SETTINGS: "true"
      DEFAULT_MICROPHONE_PRIVACY_SETTINGS: "true"
      MATRIX_API_URI: ""
      MATRIX_PUBLIC_URI: ""
      MATRIX_ADMIN_USER: ""
      MATRIX_ADMIN_PASSWORD: ""
      START_ROOM_URL: "/_/global/maps.workadventure.localhost/tests/E2E/empty.json"
  back:
    environment:
      STARTUP_COMMAND_2: "true"
      ENABLE_CHAT: "false"
  map-storage:
    environment:
      STARTUP_COMMAND_2: "true"
  maps:
    environment:
      STARTUP_COMMAND_1: "true"

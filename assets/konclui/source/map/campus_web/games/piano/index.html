<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano</title>
<script src="https://work.konclui.com/iframe_api.js"></script>
<link rel="stylesheet" href="../kit.css">
<script src="../game-kit.js"></script>
<style>
.kg-main { align-items:center; }
.kg-stage { outline:none; }
.piano { width:min(100%, 1040px); display:flex; flex-direction:column; gap:14px; }
.top { display:flex; align-items:center; gap:14px; min-height:56px; }
.koru { width:52px; height:49px; flex:none; }
.who p { margin:0; }
.now { font-size:17px; font-weight:700; }
.now.quiet { color:var(--muted); font-weight:500; }
.hint { color:var(--muted); font-size:13px; margin-top:2px !important; }
.hint b { color:var(--fg2); font-weight:700; }

.frame { background:var(--card); border:1px solid var(--border-subtle); border-radius:16px; padding:12px 12px 16px; }
.keys { position:relative; width:100%; aspect-ratio:15 / 4.4; user-select:none; -webkit-user-select:none; touch-action:none; cursor:pointer; }
.key { position:absolute; top:0; box-sizing:border-box; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px;
  font-size:12px; font-weight:700; line-height:1; pointer-events:auto; transition:background 220ms var(--ease), box-shadow 260ms var(--ease); }
.key.white { left:calc(var(--i) * 100% / 15); width:calc(100% / 15); height:100%; background:linear-gradient(#F6F9FD, #D9E1EC);
  border:1px solid #9AA7B8; border-top:0; border-radius:0 0 9px 9px; color:#5B6B80; box-shadow:inset 0 -7px 0 rgba(3,5,26,.09); }
.key.black { left:calc(var(--i) * 100% / 15 - 100% / 15 * .29); width:calc(100% / 15 * .58); height:62%; z-index:2;
  background:linear-gradient(#22344B, #050B17); border:1px solid #02040F; border-top:0; border-radius:0 0 7px 7px; color:#98A3B3;
  box-shadow:0 3px 6px rgba(0,0,0,.45), inset 0 -5px 0 rgba(255,255,255,.06); }
.key.white.on { transition-duration:40ms; background:linear-gradient(#9DFFE3, #53FFC8); box-shadow:inset 0 -7px 0 rgba(3,5,26,.1), 0 0 22px rgba(83,255,200,.55); color:#0B3D30; z-index:1; }
.key.black.on { transition-duration:40ms; background:linear-gradient(#35E8B4, #0E8F6C); box-shadow:0 3px 6px rgba(0,0,0,.45), 0 0 20px rgba(83,255,200,.6); color:#02140F; }
.key .tag { pointer-events:none; }
@media (pointer: coarse) { .key .tag, .hint { display:none; } }
@media (max-width: 720px) { .key { font-size:10px; padding-bottom:6px; } .now { font-size:15px; } }
</style>
</head>
<body>
<main class="kg-main">
  <div class="kg-stage" id="stage" tabindex="0" aria-label="Piano">
    <div class="piano">
      <div class="top">
        <img class="koru" id="koru" alt="">
        <div class="who">
          <p class="now quiet" id="now" role="status"></p>
          <p class="hint" id="hint"></p>
        </div>
      </div>
      <div class="frame"><div class="keys" id="keys"></div></div>
    </div>
  </div>
</main>
<script>
// Piano: 25 keys (C4..C6) played with the mouse, fingers (several at once) or the computer keyboard. Every note you play goes
// to the people around you as KG.event "piano:nota" {n: midi 60..84, v: 0..1}, nothing else; notes from others light the keys
// and sound here too. The sound is synthesized with Web Audio from the same recipe as media/sounds/piano/*.mp3 (see make_samples.py).
(async () => {
  "use strict";
  await KG.ready();

  const LOW = 60, HIGH = 84;
  const NAMES = ["Dó", "Dó#", "Ré", "Ré#", "Mi", "Fá", "Fá#", "Sol", "Sol#", "Lá", "Lá#", "Si"];
  const noteName = (n) => `${NAMES[n % 12]}${Math.floor(n / 12) - 1}`;
  const isBlack = (n) => [1, 3, 6, 8, 10].includes(n % 12);

  // Computer keyboard: physical keys (event.code, so ABNT2 and QWERTY agree) -> semitones above the base C. The "Ç" key is code Semicolon.
  const KEYMAP = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16 };
  const KEYLABEL = ["A", "W", "S", "E", "D", "F", "T", "G", "Y", "H", "U", "J", "K", "O", "L", "P", "Ç"];
  let base = 60; // Z and X move the computer keyboard one octave (C4 or C5)

  const chrome = KG.chrome({
    title: "Piano",
    help: "Toque nas teclas com o mouse ou com o dedo (vários dedos ao mesmo tempo funcionam). No teclado do computador, A S D F G H J K L Ç tocam as teclas brancas e W E T Y U O P as pretas, de Dó4 a Mi5; Z e X trocam a oitava para chegar nas notas mais agudas. Quem estiver com o piano aberto por perto ouve as suas notas, e você ouve as deles. O som liga na primeira tecla que você tocar.",
  });
  const stage = document.getElementById("stage");
  const keysEl = document.getElementById("keys");
  const nowEl = document.getElementById("now");
  const hintEl = document.getElementById("hint");
  const koruEl = document.getElementById("koru");
  koruEl.src = KG.asset("koru.png");

  // ------------------------------------------------------------------ keyboard drawing
  const keyEls = new Map(); // midi -> element
  {
    let whites = 0;
    for (let n = LOW; n <= HIGH; n += 1) {
      const el = document.createElement("div");
      el.dataset.n = String(n);
      el.setAttribute("aria-label", noteName(n));
      const tag = document.createElement("span");
      tag.className = "tag";
      el.append(tag);
      if (isBlack(n)) {
        el.className = "key black";
        el.style.setProperty("--i", String(whites)); // centered on the border between two whites
      } else {
        el.className = "key white";
        el.style.setProperty("--i", String(whites));
        whites += 1;
      }
      keysEl.append(el);
      keyEls.set(n, el);
    }
  }

  function showLabels() {
    for (const [n, el] of keyEls) {
      const i = n - base;
      el.firstChild.textContent = i >= 0 && i < KEYLABEL.length ? KEYLABEL[i] : "";
    }
    const last = Math.min(base + KEYLABEL.length - 1, HIGH);
    hintEl.textContent = `Teclado do computador: ${noteName(base)} a ${noteName(last)} (Z e X trocam a oitava).`;
  }
  showLabels();

  // ------------------------------------------------------------------ lit keys
  const lit = new Map(); // midi -> how many things keep it lit (fingers, keys, a note from someone else)
  function lightOn(n) {
    lit.set(n, (lit.get(n) || 0) + 1);
    keyEls.get(n).classList.add("on");
  }
  function lightOff(n) {
    const left = (lit.get(n) || 1) - 1;
    if (left > 0) lit.set(n, left);
    else { lit.delete(n); keyEls.get(n).classList.remove("on"); }
  }

  // ------------------------------------------------------------------ sound: the recipe of make_samples.py, rendered once per note
  const RATE = 22050, DURATION = 1.2, FADE = 0.15, ATTACK = 0.004, PEAK = 0.6;
  const PARTIALS = [[1, 1.0], [2, 0.5], [3, 0.22], [4, 0.1], [5, 0.05]];
  const INHARM = 0.0003, DETUNE = 1.0018, TAU0 = 0.55, TAU_SLOPE = 0.9;

  function render(midi) {
    const freq = 440 * 2 ** ((midi - 69) / 12), tau0 = TAU0 * 2 ** (-(midi - 60) / 36);
    const parts = PARTIALS.map(([k, amp]) => [freq * k * Math.sqrt(1 + INHARM * k * k), amp, tau0 / (1 + TAU_SLOPE * (k - 1))]);
    const data = new Float32Array(Math.floor(RATE * DURATION));
    let top = 0;
    for (let i = 0; i < data.length; i += 1) {
      const t = i / RATE;
      let s = 0;
      for (const [f, amp, tau] of parts) s += amp * Math.exp(-t / tau) * 0.5 * (Math.sin(2 * Math.PI * f * t) + Math.sin(2 * Math.PI * f * DETUNE * t));
      if (t < ATTACK) s *= t / ATTACK;
      if (t > DURATION - FADE) s *= (DURATION - t) / FADE;
      data[i] = s;
      top = Math.max(top, Math.abs(s));
    }
    for (let i = 0; i < data.length; i += 1) data[i] *= PEAK / top;
    return data;
  }

  const audio = { ctx: null, master: null, buffers: new Map(), voices: new Set() };
  const MAX_VOICES = 24;

  // Starts (or resumes) the AudioContext. Only called from a real gesture: a context created earlier would stay suspended.
  function unlock() {
    if (!audio.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      try {
        audio.ctx = new Ctx();
      } catch {
        return;
      }
      const limiter = audio.ctx.createDynamicsCompressor();
      audio.master = audio.ctx.createGain();
      audio.master.gain.value = 0.8;
      audio.master.connect(limiter);
      limiter.connect(audio.ctx.destination);
      chrome.status("Som ligado");
      warm(LOW);
    }
    if (audio.ctx.state === "suspended") audio.ctx.resume().catch(() => {});
  }

  function bufferFor(n) {
    let buf = audio.buffers.get(n);
    if (!buf) {
      buf = audio.ctx.createBuffer(1, Math.floor(RATE * DURATION), RATE);
      buf.getChannelData(0).set(render(n));
      audio.buffers.set(n, buf);
    }
    return buf;
  }

  // Renders the notes nobody asked for yet, one every few ms, so no key press has to wait for its note.
  function warm(n) {
    if (n > HIGH || !audio.ctx) return;
    bufferFor(n);
    setTimeout(() => warm(n + 1), 25);
  }

  function play(n, v) {
    if (!audio.ctx) return null;
    const ctx = audio.ctx, src = ctx.createBufferSource(), gain = ctx.createGain();
    src.buffer = bufferFor(n);
    gain.gain.value = 0.2 + 0.8 * v * v;
    src.connect(gain).connect(audio.master);
    const voice = { src, gain, t0: ctx.currentTime };
    src.onended = () => { audio.voices.delete(voice); src.disconnect(); gain.disconnect(); };
    audio.voices.add(voice);
    src.start();
    if (audio.voices.size > MAX_VOICES) release(audio.voices.values().next().value, 0.03);
    return voice;
  }

  // The damper: a note let go sounds a little longer (so a tap is not a click) and fades.
  function release(voice, fade = 0.25) {
    if (!voice || !audio.ctx) return;
    const t = audio.ctx.currentTime, at = Math.max(t, voice.t0 + (fade > 0.1 ? 0.3 : 0));
    voice.gain.gain.cancelScheduledValues(t);
    voice.gain.gain.setValueAtTime(voice.gain.gain.value, at);
    voice.gain.gain.linearRampToValueAtTime(0, at + fade);
    voice.src.stop(at + fade + 0.02);
  }

  // ------------------------------------------------------------------ who is playing
  const presence = { me: -Infinity, others: -Infinity };
  let presenceTimer = 0, lastNote = "";
  function refreshNow() {
    const t = performance.now(), me = t - presence.me < 1600, others = t - presence.others < 1600;
    nowEl.classList.toggle("quiet", !me && !others);
    nowEl.textContent = me && others ? "Você e mais gente estão tocando juntos" : me ? `Você está tocando${lastNote ? `: ${lastNote}` : ""}` :
      others ? "Alguém está tocando junto" : "Ninguém tocando agora. Toque uma tecla!";
    clearTimeout(presenceTimer);
    if (me || others) presenceTimer = setTimeout(refreshNow, 400);
  }
  refreshNow();

  let hop = null;
  function koruHop() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || (hop && hop.playState === "running")) return;
    hop = koruEl.animate([{ transform: "translateY(0)" }, { transform: "translateY(-9px)" }, { transform: "translateY(0)" }], { duration: 240, easing: "ease-out" });
  }

  // ------------------------------------------------------------------ sharing: at most 12 notes per second leave this page
  const SEND_MAX = 12, SEND_WINDOW = 1000, RECEIVE_MAX = 40;
  const stats = { sent: 0, dropped: 0, received: 0 };
  const sentAt = [], receivedAt = [];
  function allow(log, max) {
    const t = performance.now();
    while (log.length && t - log[0] > SEND_WINDOW) log.shift();
    if (log.length >= max) return false;
    log.push(t);
    return true;
  }

  function share(n, v) {
    if (!allow(sentAt, SEND_MAX)) { stats.dropped += 1; return; }
    stats.sent += 1;
    Promise.resolve(KG.event.send("piano:nota", { n, v: Math.round(v * 100) / 100 })).catch(() => {});
  }

  KG.event.on("piano:nota", (data, { mine }) => {
    if (mine) return; // already played here
    if (!data || !Number.isInteger(data.n) || data.n < LOW || data.n > HIGH || !Number.isFinite(data.v) || data.v < 0 || data.v > 1) return;
    if (!allow(receivedAt, RECEIVE_MAX)) return;
    stats.received += 1;
    lightOn(data.n);
    setTimeout(() => lightOff(data.n), 380);
    play(data.n, data.v);
    presence.others = performance.now();
    refreshNow();
    koruHop();
  });

  // ------------------------------------------------------------------ playing: fingers, mouse and computer keys all go through press/letGo
  const held = new Map(); // token ("k:KeyA", "p:3") -> { n, voice, since }
  function press(token, n, v) {
    if (n < LOW || n > HIGH || held.has(token)) return;
    unlock();
    held.set(token, { n, voice: play(n, v), since: performance.now() });
    lightOn(n);
    share(n, v);
    presence.me = performance.now();
    lastNote = noteName(n);
    refreshNow();
    koruHop();
  }

  function letGo(token) {
    const h = held.get(token);
    if (!h) return;
    held.delete(token);
    release(h.voice);
    setTimeout(() => lightOff(h.n), Math.max(0, 140 - (performance.now() - h.since))); // a tap still flashes
  }
  const letGoAll = () => { for (const token of [...held.keys()]) letGo(token); };

  // computer keyboard
  document.addEventListener("keydown", (ev) => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.code === "KeyZ" || ev.code === "KeyX") {
      ev.preventDefault();
      if (!ev.repeat) { base = ev.code === "KeyZ" ? 60 : 72; showLabels(); }
      return;
    }
    const i = ev.code in KEYMAP ? KEYMAP[ev.code] : ev.key === "ç" || ev.key === "Ç" ? 16 : -1;
    if (i === -1) return;
    ev.preventDefault();
    if (!ev.repeat) press(`k:${ev.code}`, base + i, 0.8);
  });
  document.addEventListener("keyup", (ev) => letGo(`k:${ev.code}`));
  window.addEventListener("blur", letGoAll);
  document.addEventListener("visibilitychange", () => { if (document.hidden) letGoAll(); });

  // mouse and fingers
  const keyAt = (x, y) => document.elementFromPoint(x, y)?.closest?.("[data-n]") ?? null;
  const velocity = (el, y) => {
    const r = el.getBoundingClientRect();
    return 0.45 + 0.55 * Math.max(0, Math.min(1, (y - r.top) / r.height)); // hit the key lower, play louder
  };
  keysEl.addEventListener("pointerdown", (ev) => {
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    const el = keyAt(ev.clientX, ev.clientY);
    if (!el) return;
    ev.preventDefault();
    try { keysEl.setPointerCapture(ev.pointerId); } catch { /* synthetic pointers cannot be captured */ }
    press(`p:${ev.pointerId}`, Number(el.dataset.n), velocity(el, ev.clientY));
    stage.focus({ preventScroll: true });
  });
  keysEl.addEventListener("pointermove", (ev) => { // a slide over the keys plays each one it crosses
    const token = `p:${ev.pointerId}`, h = held.get(token);
    if (!h) return;
    const el = keyAt(ev.clientX, ev.clientY);
    if (el && Number(el.dataset.n) !== h.n) {
      letGo(token);
      press(token, Number(el.dataset.n), velocity(el, ev.clientY));
    }
  });
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) keysEl.addEventListener(type, (ev) => letGo(`p:${ev.pointerId}`));

  chrome.status("Toque numa tecla para ligar o som");
  window.focus();
  stage.focus({ preventScroll: true });

  window.__game = {
    ready: true,
    audio: () => (audio.ctx ? audio.ctx.state : "none"), // none | suspended | running
    lit: () => [...lit.keys()].sort((a, b) => a - b),
    base: () => base,
    labels: () => [...keyEls].filter(([, el]) => el.firstChild.textContent).map(([n, el]) => [n, el.firstChild.textContent]),
    voices: () => audio.voices.size,
    stats: () => ({ ...stats }),
    keys: () => keyEls.size,
  };
})();
</script>
</body>
</html>

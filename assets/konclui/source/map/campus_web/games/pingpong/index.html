<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pingue-pongue</title>
<script src="https://work.konclui.com/iframe_api.js"></script>
<link rel="stylesheet" href="../kit.css">
<script src="../game-kit.js"></script>
<style>
.kg-stage { outline:none; }
.court { position:relative; display:flex; }
.kg-stage canvas { background:#09182B; border-radius:var(--radius); box-shadow:0 0 0 1px var(--border-subtle); }
.kg-stage canvas.hide-cursor { cursor:none; }
.kg-side { overflow-y:auto; min-height:0; }
.scoreline { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 8px; align-items:baseline; }
.scoreline .who { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--accent); }
.scoreline .who + .who { color:#F79730; text-align:right; }
.scoreline .nums { grid-column:1 / -1; display:flex; justify-content:center; align-items:baseline; gap:12px; }
.scoreline b { font-size:34px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; }
.scoreline .x { color:var(--muted); }
.stats p { margin:8px 0 0; color:var(--fg2); }
.kg-side .kg-btn { align-self:stretch; padding:10px 18px; }

/* veil over the court: start, pause and end of game */
.kg-over { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(3,5,26,.72); z-index:5;
  border-radius:var(--radius); }
.kg-over[hidden] { display:none; }
.kg-over > div { background:var(--card); border:1px solid var(--border-subtle); border-radius:var(--radius); padding:20px 24px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:8px; max-width:320px; }
.kg-over h2 { margin:0; font-size:26px; font-weight:800; }
.kg-over p { margin:0; color:var(--fg2); text-wrap:balance; }
.kg-over .kg-rank { color:var(--accent); font-weight:700; }
.kg-over .kg-btn { margin-top:6px; }
@media (max-width: 720px) {
  .kg-side { flex-direction:row; flex-wrap:wrap; max-height:34%; }
  .kg-side .board-card { display:none; }
  .kg-side .kg-btn { align-self:center; }
  .kg-side .stats { flex:1; }
}
</style>
</head>
<body>
<main class="kg-main">
  <div class="kg-stage" id="stage" tabindex="0" aria-label="Quadra do pingue-pongue">
    <div class="court">
      <canvas id="canvas"></canvas>
      <div class="kg-over" id="over">
        <div>
          <h2 id="over-title">Pingue-pongue</h2>
          <p id="over-text"></p>
          <p class="kg-rank" id="rank" role="status"></p>
          <button type="button" class="kg-btn" id="over-btn">Jogar</button>
        </div>
      </div>
    </div>
  </div>
  <aside class="kg-side">
    <div class="kg-card stats">
      <h2>Placar</h2>
      <div class="scoreline" aria-live="polite">
        <span class="who" id="you-name">Você</span><span class="who">Koru</span>
        <div class="nums"><b id="s-you">0</b><span class="x">×</span><b id="s-koru">0</b></div>
      </div>
      <p>Primeiro a 7 pontos.</p>
    </div>
    <div class="kg-card board-card">
      <h2>Recordes do escritório</h2>
      <div id="board"></div>
      <p class="kg-muted" style="margin-top:8px">Saldo de pontos numa vitória contra a Koru.</p>
    </div>
    <button type="button" class="kg-btn kg-ghost" id="pause" disabled>Pausar</button>
    <button type="button" class="kg-btn" id="again">Jogar</button>
  </aside>
</main>
<script src="vendor/game.js"></script>
<script src="vendor/pong.js"></script>
<script>
// Glue: the original game (you against the Koru) + the campus top 10 (room variable recordesPong) + test hooks.
(async () => {
  "use strict";
  const me = await KG.ready();

  const touch = matchMedia("(pointer: coarse)").matches;
  const chrome = KG.chrome({
    title: "Pingue-pongue",
    help: "Você é a raquete verde, à esquerda; a Koru é a laranja, à direita. Mova a sua com W e S (ou as setas), com o mouse ou arrastando o dedo na metade esquerda da quadra. Espaço começa e continua, P ou Esc pausa. Quem fizer 7 pontos primeiro ganha. A Koru joga melhor quando está na frente e relaxa quando está atrás. Se você vencer, o saldo de pontos (marcados menos sofridos) entra nos recordes do escritório.",
  });
  const board = KG.board("recordesPong");
  const boardEl = document.getElementById("board");
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("canvas");
  const over = document.getElementById("over");
  const overTitle = document.getElementById("over-title");
  const overText = document.getElementById("over-text");
  const rankEl = document.getElementById("rank");
  const overBtn = document.getElementById("over-btn");
  const again = document.getElementById("again");
  const pauseBtn = document.getElementById("pause");
  const sYou = document.getElementById("s-you");
  const sKoru = document.getElementById("s-koru");
  document.getElementById("you-name").textContent = me.name;
  let mine = null; // "quando" of the row I just saved, to keep it highlighted

  // The court is 640 x 480 logical units: the canvas keeps 4:3 inside the stage.
  function fit() {
    const scale = Math.max(0.4, Math.min(stage.clientWidth / 640, stage.clientHeight / 480));
    canvas.style.width = `${Math.floor(640 * scale)}px`;
    canvas.style.height = `${Math.floor(480 * scale)}px`;
  }
  fit();

  const renderBoard = (rows = board.load(), highlight = -1) => board.render(boardEl, rows, highlight);
  const refreshBoard = () => {
    const rows = board.load();
    renderBoard(rows, mine ? rows.findIndex((r) => r.quando === mine) : -1);
  };

  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  function rankText(diff, result) {
    if (result.rank !== -1) return `Você entrou em ${result.rank + 1}º lugar!`;
    const missing = result.rows[result.rows.length - 1].pontos - diff + 1;
    if (diff + missing > 7) return "O top 10 já está cheio de goleadas de 7 a 0.";
    return `${missing === 1 ? "Faltou" : "Faltaram"} ${plural(missing, "ponto", "pontos")} de saldo para o top 10.`;
  }

  function showOver(title, text, button) {
    overTitle.textContent = title;
    overText.textContent = text;
    overBtn.textContent = button;
    over.hidden = false;
  }

  const game = Game.start("canvas", Pong);
  game.yourName = me.name;
  game.onscore = (you, koru) => {
    sYou.textContent = you;
    sKoru.textContent = koru;
    if (game.playing) chrome.status(`Jogando: ${you} × ${koru}`);
  };
  game.onplay = () => {
    over.hidden = true;
    rankEl.textContent = "";
    mine = null;
    refreshBoard();
    again.textContent = "Jogar de novo";
    pauseBtn.disabled = false;
    canvas.classList.add("hide-cursor");
    chrome.status("Jogando: 0 × 0");
    stage.focus({ preventScroll: true });
  };
  game.onpause = (paused) => {
    if (paused) showOver("Pausado", touch ? "Toque em Continuar." : "Aperte P ou Espaço para continuar.", "Continuar");
    else over.hidden = true;
    pauseBtn.textContent = paused ? "Continuar" : "Pausar";
    canvas.classList.toggle("hide-cursor", !paused);
    chrome.status(paused ? "Pausado" : `Jogando: ${game.scores[0]} × ${game.scores[1]}`);
    stage.focus({ preventScroll: true });
  };
  game.ongameover = async (you, koru) => {
    const won = you > koru;
    const label = `${you} × ${koru}`;
    pauseBtn.disabled = true;
    pauseBtn.textContent = "Pausar";
    canvas.classList.remove("hide-cursor");
    showOver(won ? "Você venceu!" : "A Koru venceu", won ? `${label}. Boa partida!` : `${label}. Revanche?`, "Jogar de novo");
    chrome.status(`Fim de jogo: ${label}`);
    stage.focus({ preventScroll: true });
    if (!won) return;
    const result = await board.submit(you - koru);
    mine = result.rank !== -1 ? result.rows[result.rank].quando : null;
    renderBoard(result.rows, result.rank);
    rankEl.textContent = rankText(you - koru, result);
  };

  overBtn.addEventListener("click", () => (game.paused ? game.pause() : game.start()));
  again.addEventListener("click", () => game.start());
  pauseBtn.addEventListener("click", () => game.pause());

  // Pointer: the mouse drives the paddle over the whole court, a finger only on the left half.
  function aim(e) {
    if (!game.playing || game.paused) return;
    const p = game.runner.courtPoint(e.clientX, e.clientY);
    if (e.pointerType === "touch" && p.x > game.width / 2) return;
    game.leftPaddle.aim(p.y);
  }
  canvas.addEventListener("pointerdown", aim);
  canvas.addEventListener("pointermove", aim);

  document.fonts.load("700 14px Urbanist").then(() => { if (!game.runner.handle) game.runner.draw(); });
  new ResizeObserver(() => { fit(); game.runner.resize(); }).observe(stage);
  KG.state.on("recordesPong", refreshBoard);
  refreshBoard();
  showOver("Pingue-pongue", touch ? "Você contra a Koru, a coruja da Koncluí. Toque em Jogar." : "Você contra a Koru, a coruja da Koncluí. Aperte Espaço para jogar.", "Jogar");
  chrome.status("Pronto para jogar");
  window.focus();
  stage.focus({ preventScroll: true });

  window.__game = {
    ready: true,
    state: () => (game.playing ? (game.paused ? "paused" : "playing") : "idle"), // idle | playing | paused
    running: () => !!game.runner.handle, // is the frame loop alive?
    score: () => [...game.scores], // [you, koru]
    paddle: () => ({ y: game.leftPaddle.y, h: game.leftPaddle.height, min: game.leftPaddle.minY, max: game.leftPaddle.maxY }),
    koru: () => ({ y: game.rightPaddle.y, level: game.level(1) }),
    ball: () => ({ x: game.ball.x, y: game.ball.y, dx: game.ball.dx, dy: game.ball.dy, waiting: game.wait > 0 }),
    court: () => ({ w: game.width, h: game.height, css: canvas.clientWidth }),
    simulate: (seconds) => game.update(seconds), // test hook: advance the game without waiting for frames
    aim: (y) => game.leftPaddle.aim(y), // test hook: same as the pointer
    forceGameOver(you, koru) {
      if (!game.playing) game.start();
      game.scores = [you, koru];
      game.onscore(you, koru);
      game.finish(you > koru ? 0 : 1);
    },
  };
})();
</script>
</body>
</html>

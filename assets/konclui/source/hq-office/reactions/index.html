<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Reação</title>
<!-- A short reaction over an avatar (social.mjs): claps rising or design-system confetti bursting, ~1.7 s in a 96 px box.
     Drawn like the rest of the map: whole pixels only. The claps are a 16x16 sprite and the confetti 4x4 squares, both
     moved in steps of 2 px (no sub-pixel position, no rotation, nothing scaled by a fraction); a fade is the only blend.
     tools/test_reactions_page.py reads this file: every animated element starts and ends invisible, and an animation
     that waits for its delay fills backwards (see "Stagger" below). -->
<style>
html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; color-scheme: dark; }
/* Stagger: an element is invisible (opacity 0) until its animation starts and again after it ends. The delay is set per
   element, so every animation fills BOTH ways: without the backwards fill an element waiting out its delay shows this
   rule's own style, not the first keyframe, and a clap that is meant to start 280 ms late sits on the origin meanwhile. */
.p { position: absolute; left: 48px; top: 67px; opacity: 0; image-rendering: pixelated; will-change: transform, opacity; }
.clap { width: 16px; height: 16px; margin: -8px 0 0 -8px; background: var(--clap) 0 0 / 16px 16px no-repeat;
  translate: var(--x) 0; animation: clap-rise 1.4s steps(27, end) var(--d) both, fade 1.4s linear var(--d) both; }
.bit { width: 4px; height: 4px; margin: -2px 0 0 -2px; animation: burst 1.5s steps(1, end) var(--d) both, fade 1.5s linear var(--d) both; }
/* Up 54 px in 27 steps of 2 px. */
@keyframes clap-rise { from { transform: translateY(0); } to { transform: translateY(-54px); } }
/* The confetti goes out fast and settles. steps(1) holds each keyframe's value until the next one, the keyframes thin
   out in time (a decelerating push) and round() snaps every position to a whole unit of 2 px: --kx and --ky are where the
   bit lands, in units of 2 px, so a bit is never between two pixels. */
@keyframes burst {
  0% { translate: calc(round(var(--kx) * 0.000, 1) * 2px) calc(round(var(--ky) * 0.000, 1) * 2px); }
  4% { translate: calc(round(var(--kx) * 0.086, 1) * 2px) calc(round(var(--ky) * 0.086, 1) * 2px); }
  9% { translate: calc(round(var(--kx) * 0.187, 1) * 2px) calc(round(var(--ky) * 0.187, 1) * 2px); }
  15% { translate: calc(round(var(--kx) * 0.301, 1) * 2px) calc(round(var(--ky) * 0.301, 1) * 2px); }
  22% { translate: calc(round(var(--kx) * 0.421, 1) * 2px) calc(round(var(--ky) * 0.421, 1) * 2px); }
  30% { translate: calc(round(var(--kx) * 0.544, 1) * 2px) calc(round(var(--ky) * 0.544, 1) * 2px); }
  40% { translate: calc(round(var(--kx) * 0.675, 1) * 2px) calc(round(var(--ky) * 0.675, 1) * 2px); }
  52% { translate: calc(round(var(--kx) * 0.801, 1) * 2px) calc(round(var(--ky) * 0.801, 1) * 2px); }
  66% { translate: calc(round(var(--kx) * 0.907, 1) * 2px) calc(round(var(--ky) * 0.907, 1) * 2px); }
  82% { translate: calc(round(var(--kx) * 0.977, 1) * 2px) calc(round(var(--ky) * 0.977, 1) * 2px); }
  100% { translate: calc(round(var(--kx) * 1.000, 1) * 2px) calc(round(var(--ky) * 1.000, 1) * 2px); }
}
/* Full opacity for the first 40%, then a straight fade to nothing; it comes in over the first 8%. */
@keyframes fade { 0% { opacity: 0; } 8% { opacity: 1; } 40% { opacity: 1; } 100% { opacity: 0; } }
/* Reduced motion: no travel. The claps stay on their spot and the confetti sits where it would have landed; both only
   appear and fade (the fade is not movement). */
@media (prefers-reduced-motion: reduce) {
  .clap { animation: fade 1.4s linear var(--d) both; }
  .bit { translate: calc(var(--kx) * 2px) calc(var(--ky) * 2px); animation: fade 1.5s linear var(--d) both; }
}
</style>
<body>
<script>
const kind = new URLSearchParams(location.search).get('kind');
const colours = ['#53FFC8', '#02D1CE', '#0A0A3D', '#FFFFFF', '#E1CDB2', '#1E454D'];
// 16x16 clap, two hands pressed together: o ink, f skin, s skin in shade, h highlight, d finger groove, k spark.
const CLAP = [
  '........k.......',
  '....ooooo..k....',
  '.k.offfffo....k.',
  '..offdffdfo.....',
  'k.ofhdfooooo...k',
  '..offdofffffo...',
  '.ooffoffdffdfo..',
  'offffofhdffdso..',
  'offffoffdffdso..',
  'offffoffdffdsoo.',
  '.oossoffffffsffo',
  '...osoffffffsffo',
  '....ooffffffsffo',
  '.....osssssssoo.',
  '......ossssso...',
  '.......ooooo....',
];
const INK = { o: '#0A0A3D', f: '#F2B84B', s: '#D98A2B', h: '#FFE08A', d: '#BE6E26', k: '#FFFFFF' };
const sprite = () => {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 16;
  const ctx = canvas.getContext('2d');
  CLAP.forEach((row, y) => [...row].forEach((c, x) => { if (INK[c]) { ctx.fillStyle = INK[c]; ctx.fillRect(x, y, 1, 1); } }));
  return `url(${canvas.toDataURL()})`;
};
const px = (n) => `${n}px`;
const set = (el, name, value) => el.style.setProperty(name, value);
if (kind === 'palmas') document.documentElement.style.setProperty('--clap', sprite());
for (let i = 0; i < (kind === 'palmas' ? 5 : 26); i += 1) {
  const el = document.createElement('div');
  if (kind === 'palmas') {
    el.className = 'p clap';
    set(el, '--x', px((i - 2) * 12)); set(el, '--d', `${i * 70}ms`);
  } else {
    // Where the bit lands, in units of 2 px (the page's burst keyframes round every position to one).
    const a = Math.random() * Math.PI * 2, d = 18 + Math.random() * 30;
    const kx = Math.round(Math.cos(a) * d / 2), ky = Math.round((Math.sin(a) * d - 22) / 2);
    el.className = 'p bit'; el.style.background = colours[i % colours.length];
    set(el, '--d', '0ms'); set(el, '--kx', kx); set(el, '--ky', ky);
  }
  document.body.appendChild(el);
}
</script>
</body>
</html>

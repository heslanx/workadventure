<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<!-- WorkAdventure gives the iframe color-scheme: dark; a different scheme makes Chrome paint an opaque backdrop. -->
<meta name="color-scheme" content="dark">
<title>Carpas</title>
<style>
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color-scheme: dark; }
/* 1 canvas px = 1 map px; WorkAdventure's zoom scales it like the map's own pixels. */
canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
</style>
<canvas id="koi" data-koi="./" aria-label="Carpas no lago. Clique na água para alimentar."></canvas>
<script src="/iframe_api.js"></script>
<script type="module" src="koi.mjs"></script>
</html>

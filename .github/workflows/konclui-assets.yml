# The art pipeline's checks, on the CI pool of Koncluí (self-hosted, never a GitHub-hosted runner).
#
# Started by hand only (workflow_dispatch): nothing pushes or pulls it. It runs, in this order:
#   1. python3 -I tools/toolchain.py status   the three SpriteFusion tools must resolve and match their pins
#   2. the Python tests of assets/konclui/source/tools (test_gridguard.py needs no tool; test_ingest.py needs the FIXED pixel snapper)
#   3. (input build_and_verify) hq-office/build.py into $RUNNER_TEMP, then tools/verify.py over it
#      (input rebuild adds verify.py --rebuild: the build runs twice and the bytes are compared)
#
# THE RUNNER NEEDS python3 with numpy and Pillow, and the three tools on its PATH (or in ~/.cargo/bin, or named by
# SPRITEFUSION_PIXEL_SNAPPER_BIN, SPRITEFUSION_NORMALS_BIN, SPRITEFUSION_PALETTE_SNAPPER_BIN). This workflow installs NOTHING:
# when a tool is missing or is not the pinned version, step 1 fails and prints the exact install command of each one, to be
# run once on the host by whoever owns it (assets/konclui/source/tools/README.md, "Tools, versions, provenance").
# The pixel snapper is the FIXED build (the pinned commit plus tools/patches/pixel-snapper-fix.patch), installed once with
#   cd assets/konclui/source && python3 -I tools/build_pixel_snapper.py      (needs git and cargo; the stock tool is refused)
# into ~/.cargo/bin as spritefusion-pixel-snapper-fixed; the stock Homebrew spritefusion-pixel-snapper is not the pin.
# Until that is done on a runner, step 1 and the tests of test_ingest.py and test_toolchain.py fail there, by design (no fallback).
# A build manifest made before the fixed snapper became the pin says "1.0.0" and cannot say which build made it: rebuild it
# (hq-office/build.py) after installing the fixed one.
# Nothing here publishes: the publish step (tools/publish.py) writes into a served map directory and stays a manual act.
name: Konclui assets

on:
  workflow_dispatch:
    inputs:
      build_and_verify:
        description: Also build the office map and run tools/verify.py over it
        type: boolean
        default: false
      rebuild:
        description: With build_and_verify, also build twice and compare the bytes (verify.py --rebuild)
        type: boolean
        default: false

concurrency:
  group: konclui-assets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assets:
    name: Toolchain, tests and verify on the CI pool
    runs-on: [self-hosted, ci-host]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: assets/konclui/source
    steps:
      - uses: actions/checkout@v4

      - name: Python libraries the tools import
        run: |
          python3 -I -c 'import numpy, PIL' || {
            echo "::error::the runner's python3 needs numpy and Pillow (the art tools import them); this workflow installs nothing"
            exit 1
          }

      - name: Toolchain status (fails with the install commands when a tool is missing or not the pinned one)
        run: python3 -I tools/toolchain.py status

      - name: Build the office map
        if: ${{ inputs.build_and_verify }}
        run: python3 hq-office/build.py --out "$RUNNER_TEMP/konclui-assets/dist" --renders "$RUNNER_TEMP/konclui-assets/renders"

      - name: Python tests of the art tools
        run: |
          if [ -d "$RUNNER_TEMP/konclui-assets/dist" ]; then export KONCLUI_DIST="$RUNNER_TEMP/konclui-assets/dist"; fi
          failed=0
          for test in tools/test_toolchain.py tools/test_pixelgrid.py tools/test_palettesnap.py tools/test_gridguard.py \
                      tools/test_ingest.py tools/test_publish.py tools/test_verify.py tools/test_kinds.py \
                      tools/test_fx_kinds.py; do
            echo "::group::$test"
            python3 -I "$test" || { echo "::error::$test failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed

      - name: Verify the build (is it fit to publish)
        if: ${{ inputs.build_and_verify }}
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          dist="$RUNNER_TEMP/konclui-assets/dist"
          args=()
          if [ "$REBUILD" = "true" ]; then args+=(--rebuild); fi
          status=0
          python3 -I tools/verify.py "$dist" --out "$RUNNER_TEMP/konclui-assets/verify.json" "${args[@]}" || status=$?
          # the report is the job's summary, written whether verify.py passed or not, so the failures can be read from the run page
          { echo '```'; cat "$RUNNER_TEMP/konclui-assets/verify.json"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit $status
